name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS .IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Web Distribution Bundle
        run: |
          mkdir -p ios/App/App/www
          cp -r index.html css js ios/App/App/www/ || true

      - name: Build iOS Application (.app)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme EclipseWeaver \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     build || {
                       echo "Falling back to swiftc compiler..."
                       mkdir -p build/Release-iphoneos/EclipseWeaver.app
                       swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios14.0 App/AppDelegate.swift -o build/Release-iphoneos/EclipseWeaver.app/EclipseWeaver
                       cp App/Info.plist build/Release-iphoneos/EclipseWeaver.app/
                       cp -r App/www build/Release-iphoneos/EclipseWeaver.app/
                     }

      - name: Package into iOS .IPA
        run: |
          mkdir -p Payload
          if [ -d "ios/App/build/Release-iphoneos/EclipseWeaver.app" ]; then
            cp -r ios/App/build/Release-iphoneos/EclipseWeaver.app Payload/
          elif [ -d "ios/App/build/Release-iphoneos/App.app" ]; then
            cp -r ios/App/build/Release-iphoneos/App.app Payload/EclipseWeaver.app
          fi
          zip -r EclipseWeaver.ipa Payload
          echo "IPA Package generated successfully!"

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EclipseWeaver-iOS-IPA
          path: EclipseWeaver.ipa
          retention-days: 90

      - name: Create GitHub Release with IPA Asset
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          files: EclipseWeaver.ipa
          tag_name: v1.0.0
          name: Eclipse Weaver iOS Release v1.0.0
          body: |
            ## Eclipse Weaver: Echoes of the Cosmos (iOS .IPA Build)
            
            This release contains the iOS `.ipa` application package built directly via GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
